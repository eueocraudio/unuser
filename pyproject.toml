[project]
name = "unuser"
version = "1.3.1"
description = "UniqueUser — sincronização hierárquica com cofre cifrado (zero-knowledge)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
unuser = "client.cli:main"
unuserd = "server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["client*", "common*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
