[project]
name = "unuser"
version = "0.0.1"
description = "UniqueUser — sincronização hierárquica com cofre cifrado (zero-knowledge)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
    "blake3>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unuser*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
